name: FTP publication stopped - manual upload

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ftp-access-session.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoosh-parsi-hosting
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm automatic FTP publication is stopped
        run: echo 'FTP publication stopped at the user request. Website files will be uploaded manually.'
