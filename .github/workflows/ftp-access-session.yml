name: Temporary FTP access session

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ftp-access-session.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoosh-parsi-hosting
  cancel-in-progress: false

jobs:
  session:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Identify this runner and allowlist window
        id: network
        run: |
          python3 - <<'PY'
          import ipaddress, json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          ip = None
          for url in ['https://checkip.amazonaws.com/', 'https://api.ipify.org/']:
              try:
                  candidate = urllib.request.urlopen(url, timeout=15).read(100).decode().strip()
                  ip = str(ipaddress.IPv4Address(candidate))
                  break
              except Exception:
                  continue
          if not ip:
              raise SystemExit('Could not determine this runner IPv4 address.')
          deadline = datetime.now(timezone.utc) + timedelta(minutes=25)
          iran = deadline.astimezone(ZoneInfo('Asia/Tehran'))
          record = {'ip': ip, 'deadline_utc': deadline.isoformat(), 'deadline_iran': iran.isoformat(), 'run_id': os.environ['GITHUB_RUN_ID']}
          with open('runner-ip.json', 'w') as f:
              json.dump(record, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ip={ip}\nuntil={iran:%H%M}\n')
          print(f'RUNNER_PUBLIC_IP={ip}', flush=True)
          print(f'ALLOWLIST_DEADLINE_IRAN={iran:%H:%M}', flush=True)
          PY
      - name: Test current access immediately without changing host files
        id: probe
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: python3 scripts/deploy_ftps.py --mode check
      - name: Publish IP metadata while this runner stays alive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ftp-session-ip-${{ steps.network.outputs.ip }}-until-${{ steps.network.outputs.until }}-probe-${{ steps.probe.outcome }}
          path: runner-ip.json
          retention-days: 1
      - name: Keep the same runner alive for allowlisting
        if: steps.probe.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json, time
          from datetime import datetime, timezone
          record = json.load(open('runner-ip.json'))
          deadline = datetime.fromisoformat(record['deadline_utc'])
          remaining = max(0, (deadline - datetime.now(timezone.utc)).total_seconds())
          print('Waiting for the user to allowlist this exact runner; no host files changed yet.', flush=True)
          time.sleep(remaining)
          PY
      - name: Build public-only website files
        run: python3 scripts/build_hosting_release.py
      - name: Verify access and perform the authorized initial publication
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: python3 scripts/deploy_ftps.py --mode deploy
      - name: Keep previous public files for recovery
        if: ${{ always() && hashFiles('_hosting_backup/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosting-backup-${{ github.run_id }}
          path: _hosting_backup/
          retention-days: 30
          if-no-files-found: ignore
